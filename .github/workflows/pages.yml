name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build published site from index.html
        run: python3 tools/build_site.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # This repo still has Pages set to "Deploy from a branch". GitHub runs
      # its own Jekyll deployment for each push. Wait for that deployment to
      # finish before publishing the transformed shell, so the branch build
      # cannot overwrite the shell afterward.
      - name: Wait for GitHub's branch-based Pages deployment
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 10 * 60 * 1000;
            const { owner, repo } = context.repo;
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo, environment: 'github-pages', sha: context.sha, per_page: 10
              });
              const legacy = deployments.find(d => d.performed_via_github_app?.slug === 'github-pages');
              if (legacy) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo, deployment_id: legacy.id, per_page: 1
                });
                const state = statuses[0]?.state;
                if (state === 'success') {
                  core.info('GitHub Pages branch deployment finished; publishing the generated shell next.');
                  return;
                }
                if (state === 'failure' || state === 'error' || state === 'inactive') {
                  core.warning(`Branch deployment ended with ${state}; continuing with the generated shell.`);
                  return;
                }
              }
              core.info('Waiting for the branch-based Pages deployment to finish...');
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            core.warning('Timed out waiting for the branch-based deployment; continuing with the generated shell.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
